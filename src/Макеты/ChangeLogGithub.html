<!DOCTYPE html>
<html lang="ru">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{Title}}</title>
<style type="text/css">
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #24292f;
        background: #ffffff;
        margin: 0;
        padding: 32px 20px;
    }

    .document {
        max-width: 860px;
        margin: 0 auto;
    }

    h1, h2, h3, h4, h5, h6 {
        line-height: 1.25;
        margin: 1.6em 0 0.6em;
        font-weight: 600;
    }

    h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid #d8dee4; }
    h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid #d8dee4; }
    h3 { font-size: 1.25em; }
    h4 { font-size: 1em; }

    h1:first-child, h2:first-child, h3:first-child { margin-top: 0; }

    p { margin: 0 0 1em; }

    a { color: #0969da; }

    ul, ol { margin: 0 0 1em; padding-left: 2em; }

    li { margin: 0.25em 0; }

    li > ul, li > ol { margin-bottom: 0; }

    img { max-width: 100%; height: auto; }

    code {
        font-family: Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.9em;
        background: #f0f1f3;
        border-radius: 4px;
        padding: 0.15em 0.35em;
    }

    pre {
        background: #f6f8fa;
        border-radius: 6px;
        padding: 14px 16px;
        overflow: auto;
        line-height: 1.45;
    }

    pre code {
        background: none;
        padding: 0;
        font-size: 0.875em;
    }

    blockquote {
        margin: 0 0 1em;
        padding: 0 1em;
        color: #59636e;
        border-left: 4px solid #d0d7de;
    }

    table {
        border-collapse: collapse;
        margin: 0 0 1em;
        display: block;
        overflow: auto;
        max-width: 100%;
    }

    th, td {
        border: 1px solid #d0d7de;
        padding: 6px 13px;
    }

    th { background: #f6f8fa; font-weight: 600; }

    tr:nth-child(2n) td { background: #f6f8fa; }

    hr {
        height: 1px;
        border: 0;
        background: #d8dee4;
        margin: 2em 0;
    }
</style>
</head>
<body>
<div class="document">
{{Text}}
</div>
</body>
</html>
